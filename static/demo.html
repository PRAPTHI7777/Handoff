<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Generic intake form</title>
    <style>
      body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; }
      label { display: block; margin: 0.75rem 0; }
      input, select { width: 100%; padding: 0.4rem; }
    </style>
  </head>
  <body>
    <h1>Event intake</h1>
    <p>This is a generic form for testing Handoff. It is not wired into the agent.</p>
    <form method="get" action="/static/demo-done.html">
      <label>Full name <input name="name" required /></label>
      <label>Email <input name="email" type="email" required /></label>
      <label>
        Track
        <select name="track" required>
          <option value="">Choose one</option>
          <option value="engineering">Engineering</option>
          <option value="design">Design</option>
        </select>
      </label>
      <button type="submit">Submit registration</button>
    </form>
  </body>
</html>
