<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Handoff</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1>Handoff</h1>
        <p class="lede">Give a goal. The agent browses, acts, and asks you only when it must.</p>
        <form id="start-form">
          <label>
            Goal
            <textarea id="goal" required rows="4" placeholder="Register me for this event using the page I provide."></textarea>
          </label>
          <label>
            Start URL (optional)
            <input id="start-url" type="url" placeholder="https://example.com" />
          </label>
          <div class="row">
            <label>Name <input id="name" autocomplete="name" /></label>
            <label>Email <input id="email" type="email" autocomplete="email" /></label>
            <label>Phone <input id="phone" autocomplete="tel" /></label>
          </div>
          <fieldset class="mode-picker">
            <legend>When should it run?</legend>
            <label class="choice">
              <input type="radio" name="run-mode" value="now" checked />
              Run now
            </label>
            <label class="choice">
              <input type="radio" name="run-mode" value="schedule" />
              Schedule
            </label>
          </fieldset>
          <label id="schedule-field" class="hidden">
            Date and time
            <input id="run-at" type="datetime-local" />
            <span class="field-help">Uses your local time.</span>
            <span>
              Recurrence
              <select id="recurrence">
                <option value="none" selected>Once</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </span>
          </label>
          <button type="submit" id="start-btn">Start task</button>
        </form>
        <section class="scheduled-section" aria-labelledby="profile-heading">
          <h2 id="profile-heading">My Profile</h2>
          <p class="meta">Save reusable details for future tasks. Sensitive information is not stored.</p>
          <form id="profile-form">
            <label>Name <input id="profile-name" autocomplete="name" /></label>
            <label>Email <input id="profile-email" type="email" autocomplete="email" /></label>
            <label>Phone <input id="profile-phone" autocomplete="tel" /></label>
            <label>Address <input id="profile-address" autocomplete="street-address" /></label>
            <label>Preferences <textarea id="profile-preferences" rows="3"></textarea></label>
            <button type="submit" id="profile-save">Save profile</button>
            <p id="profile-status" class="meta" role="status"></p>
          </form>
        </section>
        <p id="meta" class="meta"></p>
        <div id="gate" class="gate hidden"></div>
        <section class="scheduled-section" aria-labelledby="scheduled-heading">
          <h2 id="scheduled-heading">Scheduled tasks</h2>
          <p id="scheduled-empty" class="meta">No scheduled tasks.</p>
          <ul id="scheduled-list" class="scheduled-list"></ul>
        </section>
      </section>
      <section class="panel">
        <h2>Live view</h2>
        <img id="shot" alt="Current page screenshot" class="shot hidden" />
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script src="/static/app.js?v=3"></script>
  </body>
</html>
